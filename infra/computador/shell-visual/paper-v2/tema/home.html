<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nod</title><style>
:root{--bg:#f7f4ff;--ink:#23202b;--muted:#746f7d;--accent:#6f5cff;--glass:#ffffffb8;--success:#16835b;--folder:#fbba45;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:var(--bg) url("wallpaper-nod.svg") center/cover no-repeat}
.top{position:absolute;top:24px;left:28px;right:28px;display:flex;align-items:center;justify-content:space-between}.status,.display{display:flex;align-items:center;border:1px solid #fff;border-radius:999px;background:var(--glass);box-shadow:0 8px 24px #23202b14;backdrop-filter:blur(18px)}.status{height:42px;padding:0 15px;gap:10px;font-size:14px;font-weight:600}.status small,.display{color:var(--muted);font-size:13px;font-weight:400}.dot{width:9px;height:9px;border-radius:50%;background:var(--success)}.display{padding:8px 12px}
.home{position:absolute;inset:14.5% 20% 13%;display:flex;flex-direction:column;align-items:center;text-align:center}.nod{width:84px;height:84px}.clock{margin-top:14px;font-size:clamp(64px,6.7vw,96px);font-weight:300;line-height:1.08;letter-spacing:-.04em}.date{color:var(--muted);font-size:15px}.hello{margin-top:24px;font-size:28px;font-weight:600;letter-spacing:-.02em}.role{margin-top:5px;color:var(--muted);font-size:15px}.apps{display:flex;gap:20px;margin-top:34px}.app{width:94px;font-size:13px}.icon{width:66px;height:66px;margin:0 auto 8px;display:grid;place-items:center;border:1px solid #fff;border-radius:20px;background:var(--glass);box-shadow:0 10px 26px #23202b18}.icon svg{width:38px;height:38px}
@media(max-width:1179px){.home{inset:16% 8% 12%}.clock{font-size:72px}.apps{margin-top:26px}.top{top:18px;left:18px;right:18px}}
@media(max-width:767px){.top{top:14px;left:14px;right:14px}.status small{display:none}.display{font-size:11px}.home{inset:15% 4% 9%}.nod{width:68px;height:68px}.clock{font-size:56px}.hello{font-size:24px;margin-top:18px}.apps{gap:4px;margin-top:24px}.app{width:82px}.icon{width:58px;height:58px;border-radius:18px}.icon svg{width:34px;height:34px}}
</style></head><body>
<header class="top"><div class="status"><span class="dot"></span><span>{{NOME}}</span><small>computador pronto</small></div><div class="display">display {{DISPLAY}}</div></header>
<main class="home">
<svg class="nod" viewBox="0 0 84 84" aria-hidden="true"><rect x="6" y="6" width="72" height="72" rx="26" fill="#fff"/><rect x="11" y="11" width="62" height="62" rx="22" fill="#6f5cff"/><rect x="29" y="32" width="7" height="18" rx="3.5" fill="#fff"/><rect x="48" y="32" width="7" height="18" rx="3.5" fill="#fff"/></svg>
<div class="clock">{{HORA}}</div><div class="date">{{DATA}}</div><div class="hello">Olá, {{NOME}}</div><div class="role">{{PAPEL}} do Nod</div>
<div class="apps" aria-label="Aplicativos disponíveis">
<div class="app"><div class="icon"><svg viewBox="0 0 38 38"><circle cx="19" cy="19" r="17" fill="#6f5cff"/><circle cx="19" cy="19" r="7" fill="#fff"/><path d="M19 2v10M4 27h11M34 27H23" fill="none" stroke="#fff" stroke-width="4"/></svg></div>Browser</div>
<div class="app"><div class="icon"><svg viewBox="0 0 38 38"><rect x="3" y="5" width="32" height="28" rx="7" fill="#282532"/><path d="m11 14 5 5-5 5M20 25h8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>Terminal</div>
<div class="app"><div class="icon"><svg viewBox="0 0 38 38"><path d="M4 11a5 5 0 0 1 5-5h7l4 4h9a5 5 0 0 1 5 5v14a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V11Z" fill="#fbba45"/><path d="M4 15h30" fill="none" stroke="#fff" stroke-width="2"/></svg></div>Files</div>
</div></main></body></html>
